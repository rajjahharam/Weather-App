<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="src/input.css">
    <link rel="stylesheet" href="src/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="m-0 p-0 bg-[#0c0c0c]">
    <!-- Nav-Bar -->
    <header class="w-full text-white">
        <nav class="flex flex-row items-center justify-between px-8 py-4 gap-8">
            <!-- Notification and Location -->
            <div class="flex items-center gap-6">
                <i class="fa-solid fa-bell text-gray-400 hover:text-white cursor-pointer"></i>
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-location-dot text-sm"></i>
                    <span class="text-sm font-medium whitespace-nowrap">Seattle, Australia</span>
                </div>
            </div>
            <!-- Search -->
            <div class="relative flex-1 max-w-2xl">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-gray-500"></i>
                </div>
                <input type="text" placeholder="Search city..."
                    class="block w-full pl-11 pr-4 py-2 bg-neutral-800 border-none rounded-xl text-sm focus:ring-1 focus:ring-gray-500 outline-none">
            </div>
            <!-- Theme -->
            <div class="flex items-center gap-6 shrink-0">
                <div class="flex bg-neutral-800 p-1 rounded-full items-center">
                    <button class="p-1.5 px-2 rounded-full">
                        <i class="fa-regular fa-sun text-xs text-gray-400"></i></button>
                    <button class="p-1.5 px-2 bg-blue-100 rounded-full text-black shadow-sm">
                        <i class="fa-solid fa-moon text-xs"></i></button>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="flex justify-between items-center mb-5 ml-6 mr-6">
            <div class="flex gap-8">
                <button class="text-xl text-gray-400 hover:text-white transition-colors cursor-pointer">Today</button>
                <button class="text-xl text-gray-400 hover:text-white cursor-pointer">Tomorrow</button>
                <button class="text-xl text-gray-400 hover:text-white cursor-pointer">Next 7
                    days</button>
            </div>
            <!-- Toggle Forecast/Air Quality -->
            <div class="flex items-center gap-6 shrink-0">
                <div class="flex bg-zinc-800 p-1 rounded-full items-center">
                    <button class="p-1.5 px-2 rounded-full bg-blue-100 text-black font-bold text-xs">
                        Forecast</button>
                    <button class="p-1.5 px-2 rounded-full text-gray-500 font-semibold shadow-sm text-xs">Air Quality
                    </button>
                </div>
            </div>
        </div>
        <!-- Week -->
        <div class="flex items-center p-8 bg-[#111111] font-['Inter']">
            <div class="flex flex-col gap-4 bg-[#c0d8f0] rounded-3xl p-6 w-[280px] text-[#1a1a1a] font-sans shadow-xl">
                <div class="flex justify-between items-center bg-[#94b2d1] rounded-t-3xl px-4 py-2 -mt-6 -mx-6">
                    <span class="font-bold text-lg">Monday</span>
                    <span class="font-bold my-font text-lg">11:42 PM</span>
                </div>
                <div class="flex justify-between items-center py-2">
                    <div class="flex flex-col">
                        <span class="text-7xl font-bold my-font tracking-tighter">16°</span>
                    </div>
                    <div class="relative">
                        <img width="80" height="80" src="https://img.icons8.com/3d-fluency/94/summer.png"
                            alt="weather-icon" class="drop-shadow-lg" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-y-1 text-[13px] leading-tight font-medium">
                    <div class="flex flex-col">
                        <span class="opacity-60">Real Feel</span>
                        <span class="font-bold my-font">18°</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="opacity-60">Wind</span>
                        <span class="font-bold my-font">N-E, 5-8 km/h</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="opacity-60">Pressure</span>
                        <span class="font-bold my-font">1000MB</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="opacity-60">Sunrise</span>
                        <span class="font-bold my-font">6:02 AM</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="opacity-60">Humidity</span>
                        <span class="font-bold my-font">51%</span>
                    </div>
                    <div class="flex flex-col">
                        <span class="opacity-60">Sunset</span>
                        <span class="font-bold my-font">9:18 PM</span>
                    </div>
                </div>
            </div>

            <div
                class="flex flex-col items-center justify-between w-[90px] h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Tue</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/3d-fluency/94/partly-cloudy-day.png" alt="partly-cloudy-day"
                    class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">10°</span>
            </div>
            <div
                class="flex flex-col items-center justify-between w-[90px] h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Wed</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/?size=100&id=SpZSUswN9tJs&format=png&color=000000"
                    alt="partly-cloudy-day" class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">15°</span>
            </div>
            <div
                class="flex flex-col items-center justify-between w-[90px] h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Thu</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/?size=100&id=MVj2tmasj0Pp&format=png&color=000000"
                    alt="partly-cloudy-day" class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">15°</span>
            </div>
            <div
                class="flex flex-col items-center justify-between w-[90px] h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Fri</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/3d-fluency/94/partly-cloudy-day.png" alt="partly-cloudy-day"
                    class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">15°</span>
            </div>
            <div
                class="flex flex-col items-center justify-between w-[90px] h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Sat</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/3d-fluency/94/partly-cloudy-day.png" alt="partly-cloudy-day"
                    class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">15°</span>
            </div>
            <div
                class="flex flex-col items-center justify-between w-22.5 h-[310px] py-8 bg-[#1a1a1a] text-white rounded-[2.5rem] border border-gray-800 shadow-lg ml-6 font-['Inter']">
                <div class="flex flex-col items-center gap-3 ">
                    <span class="text-lg font-semibold opacity-60 uppercase tracking-wider">Sun</span>
                    <div class="w-10 border-t border-white/10">
                    </div>
                </div>

                <img src="https://img.icons8.com/3d-fluency/94/partly-cloudy-day.png" alt="partly-cloudy-day"
                    class="w-12 h-12 object-contain" />
                <span class="text-3xl font-bold tracking-tight my-font">15°</span>
            </div>
        </div>
        </div>
        </div>
        </div>
    </main>
</body>

</html>
